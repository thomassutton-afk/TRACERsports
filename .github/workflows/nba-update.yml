name: Update NBA

on:
  schedule:
    # Every night at 12:00 AM Pacific, plus +30 and +60 minute rechecks
    - cron: "0,30 0 * * *"
      timezone: "America/Los_Angeles"
    - cron: "0 1 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch: # adds a manual "Run workflow" button
    inputs:
      force:
        description: "Run everything even if there are no new scores (use for testing)"
        type: boolean
        default: false

concurrency:
  group: nba-update
  cancel-in-progress: false

jobs:
  # Does nothing until the first run AFTER opening night (Tue Oct 20, 2026).
  # The midnight run on Oct 21 is the first one that picks up opening-night games.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          TODAY=$(TZ=America/Los_Angeles date +%Y-%m-%d)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "$TODAY" > "2026-10-20" ]]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Season hasn't started yet - skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: DBs
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: DBs/requirements.txt

      - name: Install packages
        run: pip install -r requirements.txt

      - name: 1 - Update results
        run: python update_nba_results.py --file nba/Results/NBA_2026_Results.xlsx

      - name: Check for new scores
        id: check
        run: |
          if [ "${{ inputs.force }}" = "true" ] || ! git diff --quiet -- nba/Results/NBA_2026_Results.xlsx; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new scores - skipping the rest."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 2 - Add season
        if: steps.check.outputs.changed == 'true'
        run: python nba/add_season.py nba/Results/NBA_2026_Results.xlsx

      - name: 3 - Export to Supabase
        if: steps.check.outputs.changed == 'true'
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASS: ${{ secrets.SUPABASE_DB_PASS }}
        run: python export_to_supabase.py --league nba --db nba_elo.db

      - name: Save Instagram cards
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nba-instagram-cards
          path: social_posts/nba/
          retention-days: 14
          if-no-files-found: ignore

      - name: 4-6 - Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "tracer-bot"
          git config user.email "tracer-bot@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          # At midnight the games were played the previous evening, so label with that date
          DATE=$(TZ=America/Los_Angeles date -d '6 hours ago' +'%b %-d, %Y')
          git commit -m "Added NBA Results for $DATE"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 15
          done
          exit 1
