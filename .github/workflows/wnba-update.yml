name: Update WNBA

on:
  schedule:
    # Every night at 12:07 AM Pacific (off the :00 mark)
    - cron: "7 0 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch: # adds a manual "Run workflow" button
    inputs:
      force:
        description: "Run everything even if there are no new scores (use for testing)"
        type: boolean
        default: false

concurrency:
  group: wnba-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: DBs
    permissions:
      contents: write
    env:
      # The database lives in a rolling GitHub release (tag db-wnba), NOT in git
      # history. Every run overwrites the release copy instead of adding a new
      # full copy of the file to the repository.
      GH_TOKEN: ${{ github.token }}
      DB_RELEASE: db-wnba
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: DBs/requirements.txt

      - name: Install packages
        run: pip install -r requirements.txt

      # No fallback on purpose: if this step fails the run stops. Carrying on
      # without the real database would let the scripts create a brand-new empty
      # one, and the upload step below would then overwrite the good copy.
      - name: Download database from release
        run: |
          gh release download "$DB_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern wnba_elo.db --dir . --clobber
          ls -l wnba_elo.db
          # Keep the copy we started from, so each run can be rolled back by one step.
          cp wnba_elo.db wnba_elo_previous.db

      - name: 1 - Update results
        run: python update_wnba_results.py --file wnba/Results/WNBA_2026_Results.xlsx --add-playoffs

      - name: Check for new scores
        id: check
        run: |
          if [ "${{ inputs.force }}" = "true" ] || ! git diff --quiet -- wnba/Results/WNBA_2026_Results.xlsx; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new scores - skipping the rest."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 2 - Add season
        if: steps.check.outputs.changed == 'true'
        run: python wnba/add_season.py wnba/Results/WNBA_2026_Results.xlsx

      - name: 3 - Export to Supabase
        if: steps.check.outputs.changed == 'true'
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASS: ${{ secrets.SUPABASE_DB_PASS }}
        run: python export_to_supabase.py --league wnba --db wnba_elo.db

      - name: Save Instagram cards
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wnba-instagram-cards
          path: social_posts/wnba/
          retention-days: 14
          if-no-files-found: ignore

      # Runs only after every step above succeeded, so a failed run never
      # replaces the release copy. wnba_elo_previous.db is the pre-run copy.
      - name: Upload database to release
        if: steps.check.outputs.changed == 'true'
        run: |
          gh release upload "$DB_RELEASE" wnba_elo.db wnba_elo_previous.db --repo "$GITHUB_REPOSITORY" --clobber

      - name: 4-6 - Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "tracer-bot"
          git config user.email "tracer-bot@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          # At midnight the games were played the previous evening, so label with that date
          DATE=$(TZ=America/Los_Angeles date -d '6 hours ago' +'%b %-d, %Y')
          git commit -m "Added WNBA Playoff Results for $DATE"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 15
          done
          exit 1
