name: Update NFL

on:
  schedule:
    # All times are Pacific. Each slot runs at the start time, +30 min, and +60 min.

    # Friday morning (Thursday night game): 12:00, 12:30, 1:00 AM
    - cron: "0,30 0 * * 5"
      timezone: "America/Los_Angeles"
    - cron: "0 1 * * 5"
      timezone: "America/Los_Angeles"

    # Sunday 10:00 AM slot (early games in Europe): 10:00, 10:30, 11:00
    - cron: "0,30 10 * * 0"
      timezone: "America/Los_Angeles"
    - cron: "0 11 * * 0"
      timezone: "America/Los_Angeles"

    # Sunday 1:30 PM slot: 1:30, 2:00, 2:30
    - cron: "30 13 * * 0"
      timezone: "America/Los_Angeles"
    - cron: "0,30 14 * * 0"
      timezone: "America/Los_Angeles"

    # Sunday 4:00 PM slot: 4:00, 4:30, 5:00
    - cron: "0,30 16 * * 0"
      timezone: "America/Los_Angeles"
    - cron: "0 17 * * 0"
      timezone: "America/Los_Angeles"

    # Monday morning (Sunday night game): 12:00, 12:30, 1:00 AM
    - cron: "0,30 0 * * 1"
      timezone: "America/Los_Angeles"
    - cron: "0 1 * * 1"
      timezone: "America/Los_Angeles"

    # Tuesday morning (Monday night game): 12:00, 12:30, 1:00 AM
    - cron: "0,30 0 * * 2"
      timezone: "America/Los_Angeles"
    - cron: "0 1 * * 2"
      timezone: "America/Los_Angeles"

  workflow_dispatch: # adds a manual "Run workflow" button
    inputs:
      force:
        description: "Run everything even if there are no new scores (use for testing)"
        type: boolean
        default: false

concurrency:
  group: nfl-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: DBs
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: DBs/requirements.txt

      - name: Install packages
        run: pip install -r requirements.txt

      - name: 1 - Update results
        run: python update_nfl_results.py --file nfl/Results/NFL_2026_Results.xlsx

      - name: Check for new scores
        id: check
        run: |
          if [ "${{ inputs.force }}" = "true" ] || ! git diff --quiet -- nfl/Results/NFL_2026_Results.xlsx; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new scores - skipping the rest."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 2 - Add season
        if: steps.check.outputs.changed == 'true'
        run: python nfl/add_season.py nfl/Results/NFL_2026_Results.xlsx

      - name: 3 - Export to Supabase
        if: steps.check.outputs.changed == 'true'
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASS: ${{ secrets.SUPABASE_DB_PASS }}
        run: python export_to_supabase.py --league nfl --db nfl_elo.db

      - name: Save Instagram cards
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nfl-instagram-cards
          path: social_posts/nfl/
          retention-days: 14
          if-no-files-found: ignore

      - name: 4-6 - Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "tracer-bot"
          git config user.email "tracer-bot@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          # Runs just after midnight are about the previous day's games, so label with that date
          DATE=$(TZ=America/Los_Angeles date -d '6 hours ago' +'%b %-d, %Y')
          # Count today's earlier commits to get the Part number
          COUNT=$(git log --oneline --grep="^Added NFL Results for $DATE" | wc -l)
          PART=$((COUNT + 1))
          git commit -m "Added NFL Results for $DATE - Part $PART"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 15
          done
          exit 1
