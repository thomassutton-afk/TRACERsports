name: Update CFB

# DRAFT - not yet run. Modeled on wnba-update.yml (database lives in a rolling
# GitHub release, not in git) and nfl-update.yml (schedule + force input).
# Steps 1-5 mirror reference/CFB_Elo_daily_update.md.
#
# Lines marked CHECK depend on script output or behavior that has not been seen
# yet. Confirm them on the first manual run with force=true.

on:
  # MANUAL-ONLY FOR NOW. After the first green forced run, delete the leading
  # '# ' from every line from 'schedule:' through the last 'timezone' line.
#   schedule:
#     # All times Pacific, off the top of the hour. Tune after a few weeks.

#     # Every morning 6:07 AM: sweeps up anything from the day before (late West
#     # Coast and Hawaii kickoffs, weeknight games, stragglers).
#     - cron: "7 6 * * *"
#       timezone: "America/Los_Angeles"

#     # Saturday: 1:07, 4:07, 7:07 and 10:07 PM
#     - cron: "7 13,16,19,22 * * 6"
#       timezone: "America/Los_Angeles"

#     # Sunday early morning: late Saturday games (12:07 and 2:07 AM)
#     - cron: "7 0,2 * * 0"
#       timezone: "America/Los_Angeles"

#     # Wed-Sat just after midnight: Tue/Wed/Thu/Fri night games
#     - cron: "7 0 * * 3,4,5,6"
#       timezone: "America/Los_Angeles"

  workflow_dispatch: # adds a manual "Run workflow" button
    inputs:
      force:
        description: "Run everything even if there are no new scores (use for testing)"
        type: boolean
        default: false

concurrency:
  group: cfb-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: DBs
    permissions:
      contents: write
    env:
      # The database lives in a rolling GitHub release (tag db-cfb), NOT in git
      # history. Create the release and upload cfb_elo.db once before the first run.
      GH_TOKEN: ${{ github.token }}
      DB_RELEASE: db-cfb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: DBs/requirements.txt

      - name: Install packages
        run: pip install -r requirements.txt

      # No fallback on purpose: if this fails the run stops, so the scripts can
      # never create an empty database that a later step uploads over the good one.
      - name: Download database from release
        run: |
          gh release download "$DB_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern cfb_elo.db --dir . --clobber
          ls -l cfb_elo.db
          # The copy we started from, so each run can be rolled back one step.
          cp cfb_elo.db cfb_elo_previous.db

      # Step 1 of the daily doc. The updater saves the xlsx on every run, even
      # when nothing changed, and openpyxl re-saves are never byte-identical, so
      # "did git see a diff" is useless here. Use the count the script prints.
      # A validation failure makes the script exit 1, which fails this step.
      - name: 1 - Update results from ESPN
        id: update
        run: |
          python update_cfb_results.py --file cfb/Results/CFB_2026_Results.xlsx 2>&1 | tee update.log
          FILLED=$(grep -oE 'Scores filled for [0-9]+' update.log | grep -oE '[0-9]+' | tail -n 1 || true)
          FILLED=${FILLED:-0}
          echo "filled=$FILLED" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force }}" = "true" ] || [ "$FILLED" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new scores - skipping the rest."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Step 2. The script always exits 0 and silently skips ties and games it
      # can't match, so read its dry-run count and require it to equal the
      # number of scores the updater filled before writing anything.
      - name: 2 - Copy scores into the CSV
        if: steps.update.outputs.changed == 'true'
        working-directory: DBs/cfb
        run: |
          python fill_csv_from_xlsx.py Results/CFB_2026_Results.xlsx Results/CFB_2026_Results.csv | tee fill_dry.log
          CAN_FILL=$(grep -oE '^[0-9]+ game\(s\) can be filled' fill_dry.log | grep -oE '[0-9]+' | tail -n 1 || true)
          CAN_FILL=${CAN_FILL:-0}
          FILLED=${{ steps.update.outputs.filled }}
          if [ "$CAN_FILL" != "$FILLED" ]; then
            echo "::error::The updater filled $FILLED game(s) but the CSV can take $CAN_FILL (ties, unmatched teams, or rows already scored). Stopping."
            exit 1
          fi
          python fill_csv_from_xlsx.py Results/CFB_2026_Results.xlsx Results/CFB_2026_Results.csv --apply

      # Step 3. Gate: the number of games inserted must equal the number of
      # scores filled, and both variants must pass their sanity checks.
      # CHECK: exact wording of the add_season.py messages.
      - name: 3 - Add games to the Elo database
        if: steps.update.outputs.changed == 'true'
        working-directory: DBs/cfb
        run: |
          python normalize_sr_games.py Results/CFB_2026_Results.csv parsed_results/parsed_games_2026.csv
          python add_season.py parsed_results/parsed_games_2026.csv 2>&1 | tee add_season.log
          INSERTED=$(grep -oE 'Inserted [0-9]+ new completed game' add_season.log | grep -oE '[0-9]+' | tail -n 1 || true)
          INSERTED=${INSERTED:-0}
          SANITY=$(grep -c 'Sanity checks passed' add_season.log || true)
          FILLED=${{ steps.update.outputs.filled }}
          echo "Inserted $INSERTED, expected $FILLED, sanity lines $SANITY"
          if [ "$INSERTED" != "$FILLED" ]; then
            echo "::error::Inserted $INSERTED game(s) but the updater filled $FILLED. Stopping before anything is exported."
            exit 1
          fi
          if [ "$FILLED" -gt 0 ] && [ "$SANITY" -lt 2 ]; then
            echo "::error::Sanity checks did not pass for both variants."
            exit 1
          fi

      # Step 5 of the daily doc, moved ahead of the export as a gate.
      # The script always exits 0, so the summary line is the only signal.
      - name: 4 - Check the workbook against the CSV
        if: steps.update.outputs.changed == 'true'
        run: |
          python compare_xlsx_vs_csv.py cfb/Results/CFB_2026_Results.xlsx cfb/Results/CFB_2026_Results.csv | tee compare.log
          if ! grep -qF 'missing from xlsx: 0 | score mismatches: 0 | in xlsx but not CSV: 0' compare.log; then
            echo "::error::Workbook and CSV disagree. Stopping before anything is exported."
            exit 1
          fi

      # The export reads the projections table, so the simulation runs first.
      # The daily doc runs this once at the end of the day. Running it on every
      # change keeps the site fresh but costs run time, so check how long it takes.
      - name: 5 - Season projections
        if: steps.update.outputs.changed == 'true'
        working-directory: DBs/cfb
        run: python simulate_season.py --season 2026

      - name: 6 - Export to Supabase
        if: steps.update.outputs.changed == 'true'
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASS: ${{ secrets.SUPABASE_DB_PASS }}
        run: |
          python export_to_supabase.py --league cfb --db cfb_elo.db --dry-run
          python export_to_supabase.py --league cfb --db cfb_elo.db

      # Runs only after every step above succeeded, so a failed run never
      # replaces the release copy. cfb_elo_previous.db is the pre-run copy.
      - name: 7 - Upload database to release
        if: steps.update.outputs.changed == 'true'
        run: |
          gh release upload "$DB_RELEASE" cfb_elo.db cfb_elo_previous.db --repo "$GITHUB_REPOSITORY" --clobber

      # Stage by name, never "git add .": the ESPN fill leaves a
      # before_espn_fill backup beside the CSV, and the logs sit in DBs.
      - name: 8 - Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "tracer-bot"
          git config user.email "tracer-bot@users.noreply.github.com"
          git add cfb/Results/CFB_2026_Results.xlsx cfb/Results/CFB_2026_Results.csv cfb/parsed_results/parsed_games_2026.csv
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          # Runs just after midnight are about the previous day's games, so label with that date
          DATE=$(TZ=America/Los_Angeles date -d '6 hours ago' +'%b %-d, %Y')
          COUNT=$(git log --oneline --grep="^Added CFB Results for $DATE" | wc -l)
          PART=$((COUNT + 1))
          git commit -m "Added CFB Results for $DATE - Part $PART"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            sleep 15
          done
          exit 1
